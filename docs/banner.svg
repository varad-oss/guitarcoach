<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">GuitarCoach</title>
  <desc id="d">A guitar practice studio that listens to you play. A fretboard with a G chord shape lit in sage green.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#79b791" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#79b791" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1d1f21" stop-opacity="1"/>
      <stop offset="0.18" stop-color="#1d1f21" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" rx="28" fill="#1d1f21"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="27.5" fill="none" stroke="#2f3337"/>

  <!-- Fretboard -->
  <g transform="translate(700 84)">
    <rect x="0" y="-14" width="560" height="220" fill="#25282b"/>
    <!-- inlays (3rd and 5th fret) -->
    <circle cx="200" cy="96" r="9" fill="#3a3f44"/>
    <circle cx="360" cy="96" r="9" fill="#3a3f44"/>
    <!-- frets -->
    <g stroke="#3a3f44" stroke-width="3">
      <line x1="80" y1="-14" x2="80" y2="206"/>
      <line x1="160" y1="-14" x2="160" y2="206"/>
      <line x1="240" y1="-14" x2="240" y2="206"/>
      <line x1="320" y1="-14" x2="320" y2="206"/>
      <line x1="400" y1="-14" x2="400" y2="206"/>
      <line x1="480" y1="-14" x2="480" y2="206"/>
    </g>
    <!-- nut -->
    <rect x="-6" y="-14" width="10" height="220" fill="#b6b8b2"/>
    <!-- strings: high E at the top, low E at the bottom -->
    <g stroke="#8b8f8a">
      <line x1="0" y1="16" x2="560" y2="16" stroke-width="1.2"/>
      <line x1="0" y1="48" x2="560" y2="48" stroke-width="1.5"/>
      <line x1="0" y1="80" x2="560" y2="80" stroke-width="1.9"/>
      <line x1="0" y1="112" x2="560" y2="112" stroke-width="2.4"/>
      <line x1="0" y1="144" x2="560" y2="144" stroke-width="3"/>
      <line x1="0" y1="176" x2="560" y2="176" stroke-width="3.6"/>
    </g>
    <!-- open strings (G, D) -->
    <g fill="none" stroke="#79b791" stroke-width="2.5">
      <circle cx="-26" cy="80" r="8"/>
      <circle cx="-26" cy="112" r="8"/>
    </g>
    <!-- G chord: low E 3, A 2, B 3, high E 3 -->
    <circle cx="120" cy="144" r="46" fill="url(#glow)"/>
    <circle cx="200" cy="176" r="46" fill="url(#glow)"/>
    <circle cx="200" cy="16" r="46" fill="url(#glow)"/>
    <circle cx="200" cy="48" r="46" fill="url(#glow)"/>
    <g fill="#79b791">
      <circle cx="120" cy="144" r="15"/>
      <circle cx="200" cy="176" r="15"/>
      <circle cx="200" cy="48" r="15"/>
      <circle cx="200" cy="16" r="15"/>
    </g>
    <g font-family="'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif" font-size="15" font-weight="700" fill="#1d1f21" text-anchor="middle">
      <text x="120" y="149">1</text>
      <text x="200" y="181">2</text>
      <text x="200" y="53">3</text>
      <text x="200" y="21">4</text>
    </g>
    <rect x="-40" y="-14" width="600" height="220" fill="url(#fade)"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(72 0)">
    <g transform="translate(0 92)">
      <rect x="0" y="0" width="56" height="56" rx="14" fill="#79b791" fill-opacity="0.14" stroke="#79b791" stroke-opacity="0.45" stroke-width="1.5"/>
      <g stroke="#8b8f8a" stroke-width="2">
        <line x1="16" y1="12" x2="16" y2="44"/>
        <line x1="25" y1="12" x2="25" y2="44"/>
        <line x1="34" y1="12" x2="34" y2="44"/>
        <line x1="43" y1="12" x2="43" y2="44"/>
        <line x1="11" y1="22" x2="47" y2="22"/>
      </g>
      <circle cx="25" cy="28" r="4.5" fill="#79b791"/>
      <circle cx="34" cy="36" r="4.5" fill="#79b791"/>
    </g>
    <text x="0" y="214" font-family="'Barlow Semi Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="76" font-weight="600" fill="#f6efdd" letter-spacing="-1">GuitarCoach</text>
    <text x="2" y="260" font-family="'Atkinson Hyperlegible','Helvetica Neue',Arial,sans-serif" font-size="25" fill="#b6b8b2">A practice studio that listens to you play.</text>
  </g>
</svg>
